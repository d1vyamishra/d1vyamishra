<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d0221"/>
    <stop offset="45%" stop-color="#1a0630"/>
    <stop offset="100%" stop-color="#12081f"/>
    <animate attributeName="x1" values="0%;20%;0%" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff3fa3"/>
    <stop offset="50%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
    <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="0%" r="80%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <style>
    .mono { font-family: 'SFMono-Regular', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 19px; }
    .title { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .blink { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { opacity: 0; } }
</style>
</defs>

<rect x="0" y="0" width="900" height="460" rx="18" fill="url(#bgGrad)"/>
<rect x="0" y="0" width="900" height="460" rx="18" fill="url(#glow)"/>
<rect x="1.5" y="1.5" width="897" height="457" rx="16.5" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

